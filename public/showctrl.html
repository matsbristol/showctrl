<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>showctrl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E3E7EC; --surface:#F7F8FA; --surface2:#ECEFF3; --ink:#1A1F27; --ink2:#4E5868; --ink3:#788396; --line:#CBD2DB;
  --accent:#2747C9; --accent-ink:#FFFFFF; --accent-soft:#DCE3FB;
  --go:#1C8549; --standby:#B07800; --stop:#C3302E; --go-soft:#D7F0E1; --standby-soft:#F8ECCB; --stop-soft:#F8DAD9;
  --strip:#131A2A; --strip2:#1D2639; --strip-ink:#EEF1F7; --strip-ink2:#9AA6BD;
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:6px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B101B; --surface:#131A28; --surface2:#1A2334; --ink:#E6EAF2; --ink2:#AAB4C6; --ink3:#7C879C; --line:#263149;
    --accent:#8299FF; --accent-ink:#0B101B; --accent-soft:#1F2A4D;
    --go:#45C982; --standby:#F1B734; --stop:#FF6764; --go-soft:#123323; --standby-soft:#3A2D0B; --stop-soft:#3E1717;
    --strip:#060910; --strip2:#111827; --strip-ink:#EEF1F7; --strip-ink2:#8E9AB1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B101B; --surface:#131A28; --surface2:#1A2334; --ink:#E6EAF2; --ink2:#AAB4C6; --ink3:#7C879C; --line:#263149;
  --accent:#8299FF; --accent-ink:#0B101B; --accent-soft:#1F2A4D;
  --go:#45C982; --standby:#F1B734; --stop:#FF6764; --go-soft:#123323; --standby-soft:#3A2D0B; --stop-soft:#3E1717;
  --strip:#060910; --strip2:#111827; --strip-ink:#EEF1F7; --strip-ink2:#8E9AB1;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--strip)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;margin:0}
h1{font-size:2rem;letter-spacing:.01em}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
p{margin:0}
a{color:var(--accent)}
img{max-width:100%}

/* ---------- strip ---------- */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--strip);color:var(--strip-ink);display:flex;align-items:center;gap:1.25rem;padding:.5rem 1rem;min-height:64px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.06em;display:flex;align-items:center;gap:.5rem;white-space:nowrap}
.brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#3E63FF;box-shadow:0 0 0 3px rgba(62,99,255,.25)}
.ev{min-width:0;line-height:1.2}
.ev b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26ch}
.ev span{color:var(--strip-ink2);font-size:.85rem}
.master{margin-left:auto;display:flex;align-items:baseline;gap:.6rem}
.master .t{font-family:var(--display);font-weight:600;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.sync{font-size:.78rem;color:var(--strip-ink2);display:flex;align-items:center;gap:.35rem;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,#8E9AB1)}
.who{display:flex;align-items:center;gap:.5rem;background:var(--strip2);border-radius:999px;padding:.25rem .3rem .25rem .75rem;font-size:.85rem;white-space:nowrap}
.who select{background:transparent;border:0;color:var(--strip-ink);max-width:16ch;padding:.15rem}
.who select option{color:#1A1F27}
.who .role{color:var(--strip-ink2)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.75rem;color:#fff;background:var(--c,#555);flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}

.urgent{background:#C3302E;color:#fff;display:flex;gap:1rem;align-items:center;padding:.6rem 1rem;flex-wrap:wrap}
.urgent b{font-family:var(--display);font-size:1.15rem;letter-spacing:.02em}
.urgent .msg{flex:1;min-width:16ch}
.urgent button{background:#fff;color:#C3302E;border:0;border-radius:var(--r);padding:.4rem .9rem;font-weight:700;cursor:pointer}
.preview{background:var(--standby);color:#1A1F27;padding:.4rem 1rem;font-size:.9rem;display:flex;gap:.75rem;align-items:center}
.preview button{background:rgba(0,0,0,.12);border:0;border-radius:var(--r);padding:.2rem .6rem;cursor:pointer}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 64px)}
nav.side{border-right:1px solid var(--line);padding:1rem .6rem;display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 64px);overflow:auto}
nav.side a{display:flex;align-items:center;gap:.65rem;padding:.55rem .7rem;border-radius:var(--r);text-decoration:none;color:var(--ink2);font-weight:700;font-size:.95rem}
nav.side a:hover{background:var(--surface2);color:var(--ink)}
nav.side a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
nav.side a[aria-current="page"] svg{color:var(--accent)}
nav.side svg{width:20px;height:20px;flex:none}
nav.side .badge{margin-left:auto}
nav.side .sep{height:1px;background:var(--line);margin:.6rem .4rem}
main{padding:1.5rem clamp(1rem,3vw,2.25rem) 4rem;min-width:0;overflow-x:clip}
.head>div:first-child{min-width:0}
.head .actions{max-width:100%}
.head{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.head p{color:var(--ink2);max-width:62ch}
.head .actions{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav.side{position:fixed;bottom:0;left:0;right:0;top:auto;z-index:15;flex-direction:row;overflow-x:auto;border-right:0;border-top:1px solid var(--line);background:var(--surface);padding:.35rem .4rem calc(.35rem + env(safe-area-inset-bottom,0px));max-height:none}
  nav.side a{flex-direction:column;gap:.15rem;font-size:.7rem;padding:.35rem .55rem;white-space:nowrap}
  nav.side .sep{display:none}
  nav.side .badge{position:absolute;margin:0;transform:translate(10px,-4px)}
  nav.side a{position:relative}
  main{padding-bottom:6.5rem}
  .master .t{font-size:2rem}
  .ev b{max-width:18ch}
  .strip{gap:.75rem}
}
@media (max-width:520px){ .ev{display:none} .sync{display:none} }

/* ---------- atoms ---------- */
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:.45rem .85rem;font-weight:700;font-size:.9rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--go);border-color:var(--go);color:#fff}
.btn.danger{color:var(--stop)}
.btn.sm{padding:.25rem .55rem;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel>.ph{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.panel>.ph .actions{margin-left:auto;display:flex;gap:.4rem}
.panel>.pb{padding:1rem}
.empty{color:var(--ink2);padding:1.25rem 1rem;font-size:.95rem}
.muted{color:var(--ink2)}
.small{font-size:.85rem}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.chip{display:inline-flex;align-items:center;gap:.3rem;border-radius:4px;padding:.05rem .45rem;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.chip.go{background:var(--go-soft);color:var(--go)}
.chip.sb{background:var(--standby-soft);color:var(--standby)}
.chip.st{background:var(--stop-soft);color:var(--stop)}
.chip.ac{background:var(--accent-soft);color:var(--accent)}
.badge{background:var(--stop);color:#fff;border-radius:999px;font-size:.7rem;font-weight:700;padding:0 .4rem;min-width:1.2rem;text-align:center;line-height:1.2rem}
.tape{display:inline-block;width:18px;height:8px;background:var(--c);border-radius:1px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.tapeL{border-left:6px solid var(--c)}
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--line);margin-bottom:1rem;overflow-x:auto}
.tabs button{border:0;background:none;padding:.55rem .9rem;font-weight:700;color:var(--ink2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{white-space:nowrap;border:0;background:var(--surface);padding:.35rem .75rem;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th{text-align:left;font-weight:700;color:var(--ink2);font-size:.82rem;padding:.55rem .75rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.55rem .75rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
td select,.inline-sel{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:.2rem .35rem;font-size:.85rem}
.lock{display:inline-flex;align-items:center;gap:.3rem;color:var(--ink3);font-size:.82rem}
.lock svg{width:14px;height:14px}
.row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:.25rem}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--go)}

/* ---------- show overview ---------- */
.stagecard{padding:0;overflow:hidden}
.stagecard .sh{display:flex;align-items:center;gap:.6rem;padding:.75rem 1rem;border-bottom:1px solid var(--line)}
.stagecard .sh h2{font-size:1.35rem}
.slot{padding:.8rem 1rem;display:grid;grid-template-columns:4.2rem 1fr auto;gap:.15rem .75rem;align-items:baseline}
.slot+.slot{border-top:1px dashed var(--line)}
.slot .lbl{font-size:.8rem;font-weight:700;color:var(--ink3)}
.slot .ttl{font-weight:700;font-size:1.05rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .cd{font-family:var(--display);font-size:1.9rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.slot .sub{grid-column:2/4;color:var(--ink2);font-size:.85rem}
.cd.warn{color:var(--standby)} .cd.over{color:var(--stop)}
.slot.now .lbl{color:var(--go)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:.65rem 1rem;border-bottom:1px solid var(--line);display:flex;gap:.6rem;align-items:flex-start}
.list li:last-child{border-bottom:0}

/* ---------- clocks ---------- */
.wall{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.tile{background:var(--strip);color:var(--strip-ink);border-radius:8px;padding:1rem 1.1rem 1.1rem;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:.2rem;min-height:170px}
.tile::before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:var(--c,#3E63FF)}
.tile .lab{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:.5rem}
.tile .lab{padding-right:1.6rem}
.tile .lab span{margin-left:auto;color:var(--strip-ink2);font-weight:400;font-size:.8rem}
.tile .val{font-family:var(--display);font-weight:600;font-size:clamp(3rem,6.5vw,4.6rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em;margin-top:auto}
.tile .val.warn{color:#FFC94A} .tile .val.over{color:#FF6E6B}
.tile .sub{color:var(--strip-ink2);font-size:.88rem;min-height:1.3em}
.tile .ctl{display:flex;gap:.35rem;margin-top:.5rem;flex-wrap:wrap}
.tile .ctl button{background:var(--strip2);color:var(--strip-ink);border:1px solid #2C3850;border-radius:4px;padding:.25rem .6rem;font-size:.8rem;font-weight:700;cursor:pointer}
.tile .ctl button:hover{border-color:#5A6A8C}
.tile .edit{position:absolute;top:.7rem;right:.7rem;background:none;border:0;color:var(--strip-ink2);cursor:pointer;padding:.2rem}
.tile .edit svg{width:16px;height:16px}
body.wallmode .strip, body.wallmode nav.side, body.wallmode .head, body.wallmode .urgent, body.wallmode .preview{display:none}
body.wallmode{background:#05070C}
body.wallmode .shell{grid-template-columns:1fr}
body.wallmode main{padding:1rem}
body.wallmode .wall{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
body.wallmode .tile{min-height:30vh}
body.wallmode .tile .val{font-size:clamp(4rem,9vw,8rem)}
body.wallmode .tile .ctl,body.wallmode .tile .edit{display:none}
.exitwall{display:none}
body.wallmode .exitwall{display:flex;position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:30}
body.wallmode .wallclock{display:flex}
.wallclock{display:none;justify-content:space-between;align-items:baseline;color:#EEF1F7;margin-bottom:1rem;gap:1rem;flex-wrap:wrap}
.wallclock .t{font-family:var(--display);font-size:clamp(4rem,12vw,10rem);font-weight:600;line-height:.9;font-variant-numeric:tabular-nums}
.wallclock .e{font-family:var(--display);font-size:1.6rem;color:#9AA6BD}

/* ---------- schedule ---------- */
.lanes{position:relative;overflow-x:auto}
.lanes-inner{min-width:820px;position:relative}
.hours{display:grid;margin-left:130px;height:24px;position:relative;font-size:.78rem;color:var(--ink3)}
.hours span{position:absolute;transform:translateX(-50%);top:2px}
.lane{display:flex;align-items:stretch;border-top:1px solid var(--line);min-height:58px}
.lane .ln{width:130px;flex:none;display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;font-weight:700;font-size:.92rem}
.lane .lt{flex:1;position:relative;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:var(--hw) 100%}
.blk{position:absolute;top:7px;bottom:7px;border-radius:4px;padding:.15rem .4rem;font-size:.78rem;line-height:1.25;overflow:hidden;background:var(--surface2);border:1px solid var(--line);color:var(--ink);cursor:default;text-align:left}
.blk b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.82rem}
.blk.set{background:var(--accent-soft);border-color:transparent;border-left:4px solid var(--c)}
.blk.live{background:var(--go-soft);border-left-color:var(--go)}
.blk.done{opacity:.55}
.blk.ch{background:repeating-linear-gradient(135deg,var(--surface2) 0 6px,transparent 6px 12px);color:var(--ink3)}
button.blk{cursor:pointer}
.mark{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--ink2);z-index:1}
.mark span{position:absolute;left:4px;bottom:3px;font-size:.7rem;font-weight:700;color:var(--ink2);white-space:nowrap;background:var(--surface);padding:0 .2rem}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--stop);z-index:2;pointer-events:none}
.nowline[data-l]::before{content:attr(data-l);position:absolute;top:-1px;left:4px;background:var(--stop);color:#fff;font-size:.7rem;font-weight:700;padding:0 .3rem;border-radius:3px}
.ro td.t{white-space:nowrap;font-variant-numeric:tabular-nums}
.ro s{color:var(--ink3);font-size:.8rem;margin-right:.3rem}
.ro tr.live td{background:var(--go-soft)}
.ro tr.done td{color:var(--ink3)}
.ro .acts{display:flex;gap:.3rem;justify-content:flex-end;flex-wrap:nowrap}
@media (max-width:600px){
  .ro tr{display:grid;grid-template-columns:7.2rem 1fr;border-bottom:1px solid var(--line)}
  .ro td{border:0;padding:.45rem .7rem}
  .ro td:nth-child(3){display:none}
  .ro td:nth-child(4){grid-column:1/-1;padding-top:0}
  .ro td:nth-child(4):empty{display:none}
  .ro .acts{justify-content:flex-start}
  .ro s{display:block;margin:0}
}

/* ---------- messages ---------- */
.msgs{display:grid;grid-template-columns:220px minmax(0,1fr);gap:1rem;align-items:start}
@media (max-width:860px){.msgs{grid-template-columns:1fr}}
.chan{display:flex;flex-direction:column;gap:2px;padding:.4rem}
.chan button{display:flex;align-items:center;gap:.5rem;border:0;background:none;padding:.45rem .6rem;border-radius:4px;font-weight:700;color:var(--ink2);cursor:pointer;text-align:left;font-size:.9rem}
.chan button[aria-pressed="true"]{background:var(--surface2);color:var(--ink)}
.chan .badge{margin-left:auto}
.compose{display:grid;gap:.6rem;padding:1rem;border-bottom:1px solid var(--line)}
.compose textarea{width:100%;min-height:70px;resize:vertical;border:1px solid var(--line);border-radius:var(--r);padding:.6rem;background:var(--bg)}
.compose .row select{border:1px solid var(--line);border-radius:var(--r);padding:.35rem;background:var(--surface)}
.m{padding:.8rem 1rem;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:.2rem .75rem}
.m.urg{background:var(--stop-soft)}
.m .meta{font-size:.82rem;color:var(--ink2);display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.m .meta b{color:var(--ink)}
.m .txt{grid-column:2;white-space:pre-wrap;overflow-wrap:anywhere}
.m .ack{grid-column:2;font-size:.8rem;color:var(--ink3);display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}

/* ---------- accommodation ---------- */
.nights th.n,.nights td.n{text-align:center;padding:.4rem .3rem;min-width:62px}
.nights td.n i{display:block;height:22px;border-radius:3px;background:var(--accent-soft);border:1px solid var(--accent)}
.nights td.n i.req{background:var(--standby-soft);border-color:var(--standby)}
.nights td.n i.in{background:var(--go-soft);border-color:var(--go)}
.over{color:var(--stop);font-weight:700}

/* ---------- riders ---------- */
.rider .ph{flex-wrap:wrap}
.items{list-style:none;margin:0;padding:0}
.items li{display:grid;grid-template-columns:1fr auto auto;gap:.6rem;align-items:center;padding:.5rem 1rem;border-bottom:1px solid var(--line)}
.items li:last-child{border-bottom:0}
.items li .q{color:var(--ink3);font-size:.85rem}
.items li.declined .tx{text-decoration:line-through;color:var(--ink3)}
@media (max-width:600px){.items li{grid-template-columns:1fr 1fr}.items li .tx{grid-column:1/3}}

/* ---------- people ---------- */
.matrix th,.matrix td{text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.matrix select{font-size:.8rem}
.lv0{color:var(--ink3)} .lv2{color:var(--go);font-weight:700}

/* ---------- dialog ---------- */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 2rem));max-height:calc(100vh - 2rem)}
dialog::backdrop{background:rgba(8,12,20,.55)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 2rem)}
dialog .dh{padding:1rem 1.25rem;border-bottom:1px solid var(--line);display:flex;align-items:center}
dialog .dh button{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:1.4rem;line-height:1}
dialog .db{padding:1rem 1.25rem;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:.85rem 1rem}
dialog .df{padding:.85rem 1.25rem;border-top:1px solid var(--line);display:flex;gap:.5rem}
dialog .df .r{margin-left:auto;display:flex;gap:.5rem}
.fld{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.fld.full{grid-column:1/-1}
.fld>span{font-size:.85rem;font-weight:700;color:var(--ink2)}
.fld small{color:var(--ink3);font-size:.8rem}
.fld input:not([type=checkbox]),.fld select,.fld textarea{border:1px solid var(--line);border-radius:var(--r);padding:.5rem .6rem;background:var(--bg);width:100%}
.fld textarea{min-height:90px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:.35rem .9rem}
.checks label{display:flex;gap:.35rem;align-items:center;font-size:.9rem}
@media (max-width:520px){dialog .db{grid-template-columns:1fr}}
.pick{list-style:none;margin:0;padding:0;grid-column:1/-1;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
.pick li{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border-bottom:1px solid var(--line);cursor:pointer}
.pick li:hover{background:var(--surface2)}

#toast{position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:.5rem;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--surface);padding:.6rem 1rem;border-radius:var(--r);font-size:.9rem;display:flex;gap:.8rem;align-items:center;pointer-events:auto;max-width:min(560px,calc(100vw - 2rem))}
#toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:4px;padding:.15rem .5rem;cursor:pointer;font-weight:700}
@media (max-width:860px){#toast{bottom:calc(5.5rem + env(safe-area-inset-bottom,0px))}}

.setup{max-width:640px;margin:3rem auto;display:grid;gap:1rem}
.setup .panel{padding:1.5rem}
.loading{padding:3rem;text-align:center;color:var(--ink2)}
@media (prefers-reduced-motion:no-preference){ .tile .val.over{animation:blink 1s steps(2) infinite} }
@keyframes blink{50%{opacity:.55}}

/* ---------- context bar: Festival HQ + one tab per stage ---------- */
.ctxbar{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:19;background:var(--strip2);display:flex;gap:2px;padding:0 .5rem;overflow-x:auto;scrollbar-width:thin}
.ctxbar a{display:flex;align-items:center;gap:.45rem;padding:.55rem .85rem;color:var(--strip-ink2);text-decoration:none;font-weight:700;font-size:.9rem;white-space:nowrap;border-bottom:3px solid transparent}
.ctxbar a:hover{color:var(--strip-ink)}
.ctxbar a[aria-current="true"]{color:var(--strip-ink);border-bottom-color:var(--c,#3E63FF)}
.ctxbar .live{width:7px;height:7px;border-radius:50%;background:#45C982;box-shadow:0 0 0 3px rgba(69,201,130,.2)}
.ctxbar .role{font-weight:400;font-size:.75rem;color:var(--strip-ink2);border:1px solid #2C3850;border-radius:3px;padding:0 .3rem}
@media (min-width:861px){ nav.side{top:calc(106px + env(safe-area-inset-top,0px));max-height:calc(100vh - 106px)} .shell{min-height:calc(100vh - 106px)} }
@media (max-width:860px){ .strip{position:relative;top:auto} .ctxbar{top:env(safe-area-inset-top,0px)} }
.kv{margin:0}
.lanes{scroll-behavior:auto}
.ctxhead{display:flex;align-items:center;gap:.6rem;padding:.2rem .7rem .7rem;font-family:var(--display);font-size:1.25rem;font-weight:600}
@media (max-width:860px){ .ctxhead{display:none} }

/* ---------- stage overview cards ---------- */
.sc-meta{display:flex;gap:.4rem 1rem;flex-wrap:wrap;padding:.6rem 1rem;border-top:1px solid var(--line);font-size:.85rem;color:var(--ink2)}
.sc-meta b{color:var(--ink)}
.sc-meta a{color:inherit}

/* ---------- lanes with packed rows ---------- */
.lane .lt{min-height:var(--lh,52px)}
.blk{height:24px;top:auto}
.lane .ln small{display:block;font-weight:400;color:var(--ink3);font-size:.75rem}
.blk.k-show{background:var(--accent-soft);border-color:transparent;border-left:4px solid var(--c)}
.blk.k-soundcheck,.blk.k-linecheck{background:var(--standby-soft);border-color:transparent}
.blk.k-changeover{background:repeating-linear-gradient(135deg,var(--surface2) 0 6px,transparent 6px 12px);color:var(--ink2)}
.blk.k-loadin,.blk.k-loadout{background:var(--surface);border-style:dashed}
.blk.k-arrival,.blk.k-departure,.blk.k-getin,.blk.k-access{background:var(--surface2);color:var(--ink2)}
.blk.live{background:var(--go-soft)!important;border-left:4px solid var(--go)}
.blk.done{opacity:.5}
.blk{display:flex;align-items:center;gap:.3rem;white-space:nowrap}
.blk b{display:inline;font-size:.78rem}

/* ---------- day sheet (vertical) ---------- */
.sheet{list-style:none;margin:0;padding:0}
.sheet li{display:grid;grid-template-columns:5.5rem 1fr auto;gap:.1rem .8rem;padding:.6rem 1rem;border-bottom:1px solid var(--line);align-items:baseline}
.sheet li:last-child{border-bottom:0}
.sheet .tm{font-weight:700;font-variant-numeric:tabular-nums}
.sheet .tm s{display:block;font-weight:400;color:var(--ink3);font-size:.78rem}
.sheet .what{font-weight:700}
.sheet .what small{display:block;font-weight:400;color:var(--ink2);font-size:.82rem}
.sheet .cd{font-family:var(--display);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink2)}
.sheet li.live{background:var(--go-soft)}
.sheet li.done{color:var(--ink3)} .sheet li.done .cd{display:none}
.sheet li.k-show .what{font-size:1.1rem}
.kind{display:inline-block;font-size:.72rem;font-weight:700;padding:0 .35rem;border-radius:3px;background:var(--surface2);color:var(--ink2);margin-right:.35rem;vertical-align:1px}
.kind.k-show{background:var(--accent-soft);color:var(--accent)}
.kind.k-soundcheck,.kind.k-linecheck{background:var(--standby-soft);color:var(--standby)}

/* ---------- contacts ---------- */
.contact{display:grid;grid-template-columns:1fr auto;gap:.1rem .6rem;padding:.6rem 1rem;border-bottom:1px solid var(--line)}
.contact:last-child{border-bottom:0}
.contact .r{color:var(--ink2);font-size:.82rem}
.contact .c{font-size:.88rem;display:flex;gap:.8rem;flex-wrap:wrap}
.contact .c a{color:var(--accent);text-decoration:none}
.tel{font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- filters ---------- */
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:.4rem .55rem;font-size:.9rem}

/* ---------- on-stage display ---------- */
.display{background:#05070C;color:#EEF1F7;border-radius:10px;padding:clamp(1rem,3vw,2.5rem);min-height:72vh;display:grid;grid-template-rows:auto 1fr auto;gap:1rem;position:relative;overflow:hidden}
.display::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--c)}
.display .top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;font-family:var(--display)}
.display .top .st{font-size:clamp(1.6rem,3vw,2.6rem);font-weight:700}
.display .top .tod{font-size:clamp(2rem,5vw,4rem);font-weight:600;font-variant-numeric:tabular-nums}
.display .mid{display:flex;flex-direction:column;justify-content:center;gap:.3rem}
.display .lbl{font-size:clamp(1rem,2vw,1.6rem);color:#9AA6BD;font-weight:700}
.display .lbl.on{color:#45C982}
.display .dwho{font-family:var(--display);font-size:clamp(2.4rem,6vw,5.5rem);font-weight:700;line-height:1}
.display .big{font-family:var(--display);font-size:clamp(5rem,20vw,17rem);font-weight:600;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.display .big.warn{color:#FFC94A} .display .big.over{color:#FF6E6B}
.display .bot{display:flex;gap:2rem;flex-wrap:wrap;color:#9AA6BD;font-size:clamp(1rem,1.8vw,1.4rem)}
.display .bot b{color:#EEF1F7}
body.wallmode .ctxbar{display:none}
body.wallmode .display{min-height:calc(100vh - 2rem)}

.pill{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);border-radius:999px;padding:.1rem .55rem .1rem .3rem;font-size:.82rem;background:var(--surface)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.3rem 1rem;font-size:.92rem}
.kv dt{color:var(--ink2)} .kv dd{margin:0}
</style>
</head>
<body>
<header class="strip" id="strip">
  <div class="brand"><i></i>showctrl</div>
  <div class="ev" id="evname"><b>Loading…</b><span></span></div>
  <div class="master"><span class="t" data-now>--:--:--</span><span class="sync" id="sync">Device time</span></div>
  <div class="who" id="who"></div>
</header>
<nav class="ctxbar" id="ctx" aria-label="Festival HQ and stages"></nav>
<div id="urgent"></div>
<div id="previewbar"></div>
<div class="shell">
  <nav class="side" id="nav" aria-label="Sections"></nav>
  <main id="main"><div class="loading">Connecting…</div></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<button class="btn exitwall" data-act="exitWall">Exit full screen</button>
<script>
'use strict';
/* =========================================================
   showctrl v2 — Festival HQ + one workspace per stage.
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const MIN = 60000, HOUR = 3600000;

const ICONS = {
  overview:'<path d="M3 4h18v12H3z"/><path d="M8 20h8M12 16v4"/>',
  today:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  clocks:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',
  schedule:'<path d="M3 6h18M3 12h18M3 18h18"/><path d="M8 4v4M15 10v4M11 16v4"/>',
  runsheet:'<path d="M3 6h18M3 12h18M3 18h18"/><path d="M8 4v4M15 10v4M11 16v4"/>',
  messages:'<path d="M4 5h16v11H9l-5 4z"/>',
  artists:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  personnel:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.5.9 2.5 2.6 3 5.2"/>',
  accommodation:'<path d="M3 20V9l9-5 9 5v11"/><path d="M8 20v-6h8v6"/>',
  riders:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
  admin:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  setup:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  display:'<rect x="2" y="4" width="20" height="13" rx="1"/><path d="M8 21h8M12 17v4"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  wall:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>',
  full:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>'
};
const ico = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

const TAPE = {red:'#D93A3A', blue:'#2F6FE0', yellow:'#E3B000', green:'#2E9E57', orange:'#EE7A1F', purple:'#8A4FD3', pink:'#DB4E95', teal:'#16999A', brown:'#8B5E3C', grey:'#6B7586', white:'#D9DEE6'};
const tapeHex = t => TAPE[t] || TAPE.grey;

/* Global permission keys (festival-wide). Stage access adds to these per stage. */
const PK = [['show','Festival overview'],['schedule','Running order'],['artists','Artists'],['personnel','Personnel'],['clocks','Clocks'],['messages','Messages'],['accommodation','Accommodation'],['riders_tech','Technical riders'],['riders_hosp','Hospitality riders'],['admin','Admin']];
const mkPerms = s => Object.fromEntries(PK.map(([k], i) => [k, +s[i]]));
const DEFAULT_ROLES = {
  admin:  {label:'Festival admin',      perms:mkPerms('2222222222'), contacts:true, locked:true},
  pm:     {label:'Production manager',  perms:mkPerms('2222222221'), contacts:true},
  liaison:{label:'Artist liaison',      perms:mkPerms('1121112220'), contacts:true},
  hosp:   {label:'Hospitality',         perms:mkPerms('1111121020'), contacts:false},
  tech:   {label:'Technical production',perms:mkPerms('1111221200'), contacts:false},
  site:   {label:'Site & security',     perms:mkPerms('1111120000'), contacts:false},
  none:   {label:'Stage access only',   perms:mkPerms('0000000000'), contacts:false, locked:true},
};
/* What a stage-level role adds, for that stage only */
const STAGE_ROLES = {manager:'Stage manager', crew:'Stage crew'};
const STAGE_LV = {
  manager:{show:1, schedule:2, artists:2, personnel:2, clocks:2, messages:2, riders_tech:2, riders_hosp:2, accommodation:1, setup:2},
  crew:{show:1, schedule:1, artists:1, personnel:1, clocks:1, messages:2, riders_tech:1}
};
const LEVELS = ['No access', 'View', 'Edit'];
const ACCRED = ['AAA','Production','Stage','Backstage','Artist','Site','Day pass'];
const TYPES = {
  festival:  {label:'Music festival', terms:{performer:'Artist', performers:'Artists', stage:'Stage', stages:'Stages'}},
  concert:   {label:'Concert / tour date', terms:{performer:'Artist', performers:'Artists', stage:'Stage', stages:'Stages'}},
  conference:{label:'Conference', terms:{performer:'Speaker', performers:'Speakers', stage:'Room', stages:'Rooms'}},
  theatre:   {label:'Theatre / performance', terms:{performer:'Company', performers:'Companies', stage:'Stage', stages:'Stages'}},
  corporate: {label:'Corporate event', terms:{performer:'Presenter', performers:'Presenters', stage:'Room', stages:'Rooms'}},
  sport:     {label:'Sports event', terms:{performer:'Team', performers:'Teams', stage:'Arena', stages:'Arenas'}},
};
const TZS = ['Europe/Oslo','Europe/Stockholm','Europe/Copenhagen','Europe/London','Europe/Berlin','Europe/Madrid','America/New_York','America/Chicago','America/Los_Angeles','Asia/Tokyo','Australia/Sydney','UTC'];
/* Day sheet activity types. Track decides which timeline lane they sit in. */
const KINDS = {
  arrival:{l:'Arrival', tr:'dock'}, getin:{l:'Get in', tr:'dock'}, loadin:{l:'Load in', tr:'dock'},
  access:{l:'Stage access', tr:'stage'}, soundcheck:{l:'Soundcheck', tr:'stage'}, linecheck:{l:'Line check', tr:'stage'},
  changeover:{l:'Changeover', tr:'stage'}, show:{l:'Show', tr:'stage'}, loadout:{l:'Load out', tr:'dock'},
  departure:{l:'Departure', tr:'dock'}, doors:{l:'Doors', tr:'stage'}, curfew:{l:'Curfew', tr:'stage'},
  meeting:{l:'Meeting', tr:'dock'}, other:{l:'Other', tr:'stage'},
  set:{l:'Show', tr:'stage'}, break:{l:'Break', tr:'stage'}
};
const TRACKS = {stage:'On stage', dock:'Dock & backstage'};
const DEFAULT_TPL = {arrival:-240, getin:-180, loadin:-120, loadinDur:45, access:-45, changeover:30, loadoutAfter:15, loadoutDur:45, departure:150, soundcheckDur:45};
const TPL_FIELDS = [['arrival','Arrival (min before show)'],['getin','Get in (min before show)'],['loadin','Load in starts (min before show)'],['loadinDur','Load in length (min)'],['access','Stage access (min before show)'],['changeover','Changeover length (min)'],['loadoutAfter','Load out starts (min after show)'],['loadoutDur','Load out length (min)'],['departure','Departure (min after show)'],['soundcheckDur','Soundcheck length (min)']];
const ART_STATUS = ['confirmed','travelling','arrived','backstage','ready','on stage','done','cancelled'];
const BOOK_STATUS = ['requested','held','confirmed','checked in','checked out','cancelled'];
const RIDER_STATUS = ['requested','agreed','sourced','declined'];
const CONTACT_ROLES = ['Tour manager','Production manager','FOH engineer','Monitor engineer','Lighting designer','Backline tech','Driver','Management','Agent','Other'];
const COLS = ['clocks','stages','artists','ros','msgs','hotels','bookings','riders','members','requests','people','stageteam'];

/* ---------------- state ---------------- */
const S = {
  mode:'local', db:null, user:null, me:null, isOwner:false, shareEdit:null, canWriteShared:true,
  cfg:null, roles:null, col:Object.fromEntries(COLS.map(c => [c, {}])),
  profiles:{}, ctx:'hq', view:'overview', arg:null, sub:{}, offset:0, sync:'device', preview:null, dirty:false, ready:false
};
const cfg = () => S.cfg || {};
const TZ = () => cfg().tz || 'Europe/Oslo';
const terms = () => ({...TYPES.festival.terms, ...(cfg().terms || {})});
const now = () => Date.now() + S.offset;

/* ---------------- time ---------------- */
const fmtCache = {};
function P(ms, tz = TZ()) {
  const f = fmtCache[tz] || (fmtCache[tz] = new Intl.DateTimeFormat('en-GB', {timeZone:tz, hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'}));
  const o = {}; for (const p of f.formatToParts(ms)) o[p.type] = p.value; if (o.hour === '24') o.hour = '00'; return o;
}
function tzOff(ms, tz) { const p = P(ms, tz); return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - Math.floor(ms / 1000) * 1000; }
function fromLocal(str, tz = TZ()) {
  if (!str) return null;
  const [d, t = '00:00'] = str.split('T'); const [Y, M, D] = d.split('-').map(Number); const [h, m] = t.split(':').map(Number);
  const g = Date.UTC(Y, M - 1, D, h, m); let ms = g - tzOff(g, tz); ms = g - tzOff(ms, tz); return ms;
}
function toLocal(ms, tz = TZ()) { if (ms == null || ms === '') return ''; const p = P(ms, tz); return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`; }
const fmtT = (ms, sec, tz) => { const p = P(ms, tz); return `${p.hour}:${p.minute}` + (sec ? `:${p.second}` : ''); };
const dayKey = (ms, tz) => { const p = P(ms, tz); return `${p.year}-${p.month}-${p.day}`; };
const festDay = ms => dayKey(ms - 6 * HOUR);
function addDays(k, n) { const [y, m, d] = k.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
function dayLabel(k, long) { const [y, m, d] = k.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d, 12)).toLocaleDateString('en-GB', {weekday:long ? 'long' : 'short', day:'numeric', month:'short', timeZone:'UTC'}); }
function eventDays() { const c = cfg(); const out = []; if (!c.start) return out; let k = c.start; for (let i = 0; i < 21 && k <= (c.end || c.start); i++) { out.push(k); k = addDays(k, 1); } return out; }
function nightsBetween(a, b) { const out = []; let k = a; for (let i = 0; i < 60 && k < b; i++) { out.push(k); k = addDays(k, 1); } return out; }
function fmtCd(ms) { const neg = ms < 0; const s = Math.floor(Math.abs(ms) / 1000); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (neg ? '+' : '') + (h ? `${h}:${pad(m)}:${pad(x)}` : `${pad(m)}:${pad(x)}`); }
function rel(ms) { const d = ms - now(), a = Math.abs(d); const v = a < MIN ? 'now' : a < HOUR ? `${Math.round(a / MIN)} min` : a < 48 * HOUR ? `${Math.round(a / HOUR * 10) / 10} h` : `${Math.round(a / (24 * HOUR))} days`; return v === 'now' ? 'just now' : d > 0 ? `in ${v}` : `${v} ago`; }
const cdState = (ms, warnMin = 5) => ms < 0 ? 'over' : ms < warnMin * MIN ? 'warn' : '';
function curDay() { const days = eventDays(); let d = S.sub.day; if (!days.includes(d)) d = days.includes(festDay(now())) ? festDay(now()) : days[0]; S.sub.day = d; return d; }

/* ---------------- access ---------------- */
function member(id = S.me) { return S.col.members[id]; }
function realRole() { if (S.mode === 'live' && S.isOwner) return 'admin'; return member()?.role || 'none'; }
function role() { return S.preview?.type === 'role' ? S.preview.role : S.preview ? 'none' : realRole(); }
function roleDef(r = role()) { return (S.roles || DEFAULT_ROLES)[r] || DEFAULT_ROLES.none; }
function perm(k) { if (role() === 'admin') return 2; return roleDef().perms?.[k] ?? 0; }
/* stage-level role for a person: manager (set by admin) or crew (added by a stage manager) */
function stageRoleOf(uid, sid) {
  if (S.col.members[uid]?.stages?.[sid] === 'manager') return 'manager';
  if (S.col.stageteam[sid]?.crew?.[uid]) return 'crew';
  return null;
}
function stageRole(sid) {
  if (!sid) return null;
  if (S.preview?.type === 'stage') return S.preview.sid === sid ? S.preview.level : null;
  if (S.preview?.type === 'role') return null;
  return stageRoleOf(S.me, sid);
}
function lv(k, sid) { let g = perm(k); const sr = stageRole(sid); if (sr) g = Math.max(g, STAGE_LV[sr][k] || 0); return g; }
function canW(k, sid) { return lv(k, sid) >= 2 && S.canWriteShared; }
function myStages() { return stagesSorted().filter(s => stageRole(s.id)); }
function visibleStages() { return perm('schedule') >= 1 || perm('show') >= 1 ? stagesSorted() : myStages(); }
function canSeeStage(sid) { return visibleStages().some(s => s.id === sid); }
function anyLv(k) { return Math.max(perm(k), ...myStages().map(s => STAGE_LV[stageRole(s.id)][k] || 0), 0); }
function artistContacts(a) { return role() === 'admin' || roleDef().contacts || stageRole(a?.stage) === 'manager'; }
function myDepts() { return member()?.depts || []; }
function modOn(id) { return cfg().modules?.[id] !== false; }
const SENS = '<span class="lock">' + ico('lock') + 'Hidden for your role</span>';

/* ---------------- names ---------------- */
function personName(id) {
  if (!id) return 'Someone';
  const mb = S.col.members[id];
  if (mb?.person && S.col.people[mb.person]) return S.col.people[mb.person].name;
  if (mb?.name) return mb.name;
  const p = S.profiles[id]; if (p?.name) return p.name;
  if (id === S.me) return 'You';
  return 'Someone';
}
function personColor(id) { return S.profiles[id]?.color || ['#2F6FE0','#8A4FD3','#16999A','#DB4E95','#EE7A1F','#2E9E57'][[...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0) % 6]; }
function initials(n) { return String(n || '?').split(/\s+/).map(x => x[0]).join('').slice(0, 2).toUpperCase(); }
function avatar(id, name) {
  const p = S.profiles[id]; const n = name || personName(id);
  return `<span class="av" style="--c:${personColor(id || n)}">${p?.avatarUrl && !name ? `<img alt="" src="${esc(p.avatarUrl)}">` : esc(initials(n))}</span>`;
}
let profTimer = null;
function wantProfiles() {
  if (S.mode !== 'live' || !S.user) return;
  clearTimeout(profTimer);
  profTimer = setTimeout(async () => {
    const ids = new Set([S.me, ...Object.keys(S.col.members), ...Object.keys(S.col.requests)]);
    Object.values(S.col.stageteam).forEach(t => Object.keys(t.crew || {}).forEach(u => ids.add(u)));
    Object.values(S.col.msgs).forEach(m => { ids.add(m.from); if (m.to?.t === 'user') ids.add(m.to.id); });
    const need = [...ids].filter(Boolean); if (!need.length) return;
    try { const ps = await S.user.profiles(need); let ch = false; for (const [k, v] of Object.entries(ps)) { if (S.profiles[k]?.name !== v.name) ch = true; S.profiles[k] = v; } if (ch) render(); } catch {}
  }, 150);
}

/* ---------------- lookups ---------------- */
const dept = id => (cfg().depts || []).find(d => d.id === id);
const deptName = id => dept(id)?.name || '—';
const deptTape = id => tapeHex(dept(id)?.tape);
const stagesSorted = () => Object.values(S.col.stages).sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || a.name.localeCompare(b.name));
const stageName = sid => S.col.stages[sid]?.name || '';
const artistsSorted = () => Object.values(S.col.artists).sort((a, b) => a.name.localeCompare(b.name));
const artistName = id => S.col.artists[id]?.name || '';
const eff = it => ({s:it.start + (it.delay || 0), e:(it.end ?? it.start) + (it.delay || 0)});
const track = it => KINDS[it.kind]?.tr || 'stage';
function itemsFor(sid, day, tr) { return Object.values(S.col.ros).filter(i => i.stage === sid && (!day || festDay(i.start) === day) && (!tr || track(i) === tr)).sort((a, b) => a.start - b.start || (a.end - b.end)); }
function itemsForArtist(aid) { return Object.values(S.col.ros).filter(i => i.artist === aid).sort((a, b) => a.start - b.start); }
function showsFor(aid) { return itemsForArtist(aid).filter(i => i.kind === 'show'); }
function nowNext(sid) {
  const t = now(); const items = itemsFor(sid, null, 'stage').filter(i => i.kind !== 'access' && i.kind !== 'curfew').sort((a, b) => eff(a).s - eff(b).s);
  const cur = items.find(i => i.status === 'live') || items.find(i => i.status !== 'done' && eff(i).s <= t && eff(i).e > t);
  const next = items.find(i => i.kind === 'show' && i !== cur && i.status !== 'done' && eff(i).s > (cur ? eff(cur).s : t - MIN));
  return {cur, next};
}
function stageManagers(sid) { return Object.entries(S.col.members).filter(([, m]) => m.stages?.[sid] === 'manager').map(([id]) => id); }
function stageCrewUsers(sid) { return Object.keys(S.col.stageteam[sid]?.crew || {}); }
function peopleFor(sid) { return Object.values(S.col.people).filter(p => !sid || (p.stages || []).includes(sid)).sort((a, b) => (a.lead === b.lead ? 0 : a.lead ? -1 : 1) || a.name.localeCompare(b.name)); }
function linkedPerson(uid) { const pid = S.col.members[uid]?.person; return pid ? S.col.people[pid] : null; }
function personUser(pid) { return Object.keys(S.col.members).find(u => S.col.members[u].person === pid); }
function stageLead(sid) { const m = stageManagers(sid).map(linkedPerson).find(Boolean); return m || peopleFor(sid).find(p => /stage manager/i.test(p.title || '') && !/assistant/i.test(p.title)) || peopleFor(sid).find(p => p.lead) || null; }

/* ---------------- persistence ---------------- */
function saveLocal() { if (S.mode !== 'local') return; clearTimeout(saveLocal.t); saveLocal.t = setTimeout(() => { try { localStorage.setItem('showctrl-demo-v2', JSON.stringify({cfg:S.cfg, roles:S.roles, col:S.col})); } catch {} }, 400); }
function failed(e) {
  const code = e?.code;
  if (code === 'invalid_argument') toast('That change was refused. Your sharing level on this page may be too low for it — ask the owner for Contributor or Editor access.');
  else if (code === 'quota_exceeded') toast('Storage is full: ' + (e.message || 'delete old messages or items to make room.'));
  else if (code === 'resource_exhausted') toast('Too many changes at once. Wait a moment and try again.');
  else toast('Could not save that change. Check your connection and try again.');
  console.warn(e);
}
const strip = o => { const b = {...o}; delete b.id; return b; };
async function put(col, id, obj) {
  if (S.mode === 'live') { try { await S.db.collection(col).doc(id).set(strip(obj)); return true; } catch (e) { failed(e); return false; } }
  S.col[col][id] = {id, ...strip(obj)}; changed(); return true;
}
function deepMerge(a, b) { const o = {...a}; for (const [k, v] of Object.entries(b)) o[k] = v && typeof v === 'object' && !Array.isArray(v) && a?.[k] && typeof a[k] === 'object' ? deepMerge(a[k], v) : v; return o; }
async function patch(col, id, obj) {
  if (S.mode === 'live') { try { await S.db.collection(col).doc(id).update(obj); return true; } catch (e) { failed(e); return false; } }
  if (!S.col[col][id]) return false; S.col[col][id] = deepMerge(S.col[col][id], obj); changed(); return true;
}
async function del(col, id) {
  if (S.mode === 'live') { try { await S.db.collection(col).doc(id).delete(); return true; } catch (e) { failed(e); return false; } }
  delete S.col[col][id]; changed(); return true;
}
async function putCfg(which, obj) {
  if (S.mode === 'live') { try { await S.db.doc('config/' + which).set(obj); return true; } catch (e) { failed(e); return false; } }
  if (which === 'event') S.cfg = obj; else S.roles = obj.roles; changed(); return true;
}
async function inChunks(tasks, n = 8, onProgress) { for (let i = 0; i < tasks.length; i += n) { await Promise.all(tasks.slice(i, i + n).map(f => f())); onProgress?.(Math.min(i + n, tasks.length), tasks.length); } }
async function putMany(col, objs) {
  if (S.mode === 'live') { try { await inChunks(objs.map(o => () => S.db.collection(col).doc(o.id).set(strip(o)))); return true; } catch (e) { failed(e); return false; } }
  objs.forEach(o => S.col[col][o.id] = {...o}); changed(); return true;
}
function changed() { saveLocal(); render(); }

/* ---------------- render loop ---------------- */
let rq = 0;
function render() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; doRender(); }); }
function typingInMain() { const a = document.activeElement; return a && $('#main').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type !== 'checkbox'; }
function doRender() {
  renderStrip(); renderCtx(); renderNav(); renderUrgent();
  if (typingInMain()) { S.dirty = true; return; }
  S.dirty = false;
  const sy = window.scrollY; const key = S.ctx + S.view + (S.sub.day || '');
  const keep = [...document.querySelectorAll('#main .lanes')].map(el => el.scrollLeft);
  $('#main').innerHTML = renderMain(); window.scrollTo(0, sy);
  document.querySelectorAll('#main .lanes').forEach((el, i) => {
    if (S.laneKey === key && keep[i] != null) el.scrollLeft = keep[i];
    else { const nl = el.querySelector('.nowline'); el.scrollLeft = nl ? Math.max(0, nl.offsetLeft - el.clientWidth / 3) : 0; }
  });
  S.laneKey = key; tick();
}
document.addEventListener('focusout', () => setTimeout(() => { if (S.dirty && !typingInMain()) render(); }, 0));

function renderStrip() {

  $('#evname').innerHTML = `<b>${esc(c.name || 'Untitled event')}</b><span>${di >= 0 ? `Day ${di + 1} of ${days.length} · ${esc(dayLabel(today, true))}` : days.length ? `${esc(dayLabel(days[0]))} – ${esc(dayLabel(days[days.length - 1]))}` : ''}</span>`;
  const sy = $('#sync'); const city = TZ().split('/').pop().replace('_', ' ');
  sy.textContent = S.sync === 'ok' ? `Synced · ${city}` : S.sync === 'corrected' ? `Corrected ${Math.round(S.offset / 1000)}s · ${city}` : `Device time · ${city}`;

  const who = $('#who');
  const myRoleLabel = () => { const st = myStages().map(s => `${STAGE_ROLES[stageRole(s.id)]}, ${s.name}`); return role() !== 'none' ? roleDef().label : st[0] || roleDef().label; };
  if (S.mode === 'local') {

  } else {

}
function personTag(uid) {
  const m = S.col.members[uid]; const r = m?.role && m.role !== 'none' ? roleDef(m.role).label : '';
  const st = stagesSorted().map(s => [s, stageRoleOf(uid, s.id)]).filter(x => x[1]);
  return r || (st[0] ? `${STAGE_ROLES[st[0][1]]}, ${st[0][0].name}` : 'No access');
}
function previewLabel() { const p = S.preview; if (!p) return ''; return p.type === 'role' ? roleDef(p.role).label : `${STAGE_ROLES[p.level]}, ${stageName(p.sid)}`; }
function renderCtx() {
  const showHQ = hqVisible();
  const ss = visibleStages();

}
function hqVisible() { return perm('show') >= 1 || perm('admin') >= 1 || perm('accommodation') >= 1 || perm('personnel') >= 1; }

function navItems() { return S.ctx === 'hq' ? HQ_NAV.filter(n => n.ok()) : STAGE_NAV.filter(n => n.ok(S.ctx)); }
function href(view, arg, ctx = S.ctx) { return ctx === 'hq' ? `#/hq/${view}${arg ? '/' + arg : ''}` : `#/s/${ctx}/${view}${arg ? '/' + arg : ''}`; }

}

}

/* ---------------- tick ---------------- */
function tick() {
  const t = now();
  document.querySelectorAll('[data-now]').forEach(el => el.textContent = fmtT(t, el.dataset.now !== 'm'));
  document.querySelectorAll('[data-cd]').forEach(el => { const ms = +el.dataset.cd - t; el.textContent = fmtCd(ms); el.classList.toggle('warn', cdState(ms, +(el.dataset.w || 5)) === 'warn'); el.classList.toggle('over', ms < 0); });
  document.querySelectorAll('[data-clock]').forEach(el => {
    const c = S.col.clocks[el.dataset.clock]; if (!c) return; const v = clockValue(c, t);
    el.textContent = v.text; el.className = 'val ' + (v.state || '');
    const sub = el.parentElement.querySelector('.sub'); if (sub) sub.textContent = v.sub || '';
  });
  if (S.view === 'display') updateDisplay();
}
setInterval(tick, 250);
setInterval(() => { if (!typingInMain() && !$('#dlg').open) render(); }, 30000);

const VIEWS = {};
function head(title, sub, actions = '') { return `<div class="head"><div><h1>${esc(title)}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${actions ? `<div class="actions">${actions}</div>` : ''}</div>`; }
function daySeg() { const days = eventDays(); const day = curDay(); return `<div class="seg" role="group" aria-label="Day">${days.map((d, i) => `<button aria-pressed="${d === day}" data-act="day" data-day="${d}">Day ${i + 1} · ${esc(dayLabel(d))}</button>`).join('')}</div>`; }
function statusChip(s) { const cls = {'on stage':'go', ready:'go', backstage:'ac', arrived:'ac', travelling:'sb', cancelled:'st'}[s] ?? ''; return `<span class="chip ${cls}">${esc(s || '—')}</span>`; }
function telLink(p) { return p ? `<a class="tel" href="tel:${esc(String(p).replace(/[^+\d]/g, ''))}">${esc(p)}</a>` : ''; }
function mailLink(e) { return e ? `<a href="mailto:${esc(e)}">${esc(e)}</a>` : ''; }
function delayChip(sid) {
  const {cur, next} = nowNext(sid); const d = (next?.delay || cur?.delay) || 0;
  return d > 0 ? `<span class="chip st">${Math.round(d / MIN)} min behind</span>` : d < 0 ? `<span class="chip ac">${Math.round(-d / MIN)} min ahead</span>` : `<span class="chip go">On time</span>`;
}
function slotHTML(lbl, it, isNow) {
  if (!it) return `<div class="slot"><span class="lbl">${lbl}</span><span class="ttl muted">${isNow ? 'Nothing on stage' : 'No more shows'}</span><span></span></div>`;
  const e = eff(it); const target = isNow ? e.e : e.s; const a = S.col.artists[it.artist];
  return `<div class="slot ${isNow ? 'now' : ''}"><span class="lbl">${lbl}</span><span class="ttl">${esc(it.title)}</span><span class="cd" data-cd="${target}"></span><span class="sub">${isNow ? `${esc(KINDS[it.kind]?.l || '')} ends ${fmtT(e.e)}` : `On stage ${fmtT(e.s)}`}${a ? ` · ${esc(a.status)}` : ''}</span></div>`;
}

/* ---------- HQ: overview ---------- */
VIEWS.overview = () => {
  const T = terms(); const t = now();
  const cards = visibleStages().map(st => {
    const {cur, next} = nowNext(st.id); const lead = stageLead(st.id);
    const crew = peopleFor(st.id).length;
    return `<section class="panel stagecard"><div class="sh"><span class="tape" style="--c:${tapeHex(st.tape)}"></span><h2><a href="#/s/${esc(st.id)}/today" style="color:inherit;text-decoration:none">${esc(st.name)}</a></h2>${delayChip(st.id)}</div>${slotHTML('Now', cur, true)}${slotHTML('Next', next, false)}
    <div class="sc-meta">${lead ? `<span>SM <b>${esc(lead.name)}</b> ${telLink(lead.phone)}</span>` : '<span>No stage manager yet</span>'}${st.radio ? `<span>Radio <b>${esc(st.radio)}</b></span>` : ''}<span><b>${crew}</b> crew</span></div></section>`;
  }).join('');
  const blocks = [];
  blocks.push(msgBlock(null));
  const soon = Object.values(S.col.ros).filter(i => (i.kind === 'arrival' || i.kind === 'departure') && eff(i).s > t - 30 * MIN && eff(i).s < t + 4 * HOUR).sort((a, b) => eff(a).s - eff(b).s).slice(0, 10);
  blocks.push(`<section class="panel"><div class="ph"><h3>Arrivals &amp; departures, next 4 hours</h3></div>${soon.length ? `<ul class="list">${soon.map(i => `<li><span class="num" style="min-width:3.2rem"><b>${fmtT(eff(i).s)}</b></span><span class="kind k-${i.kind}">${esc(KINDS[i.kind].l)}</span><span><a href="${href('artist', i.artist, 'hq')}">${esc(artistName(i.artist))}</a> <span class="muted small">· ${esc(stageName(i.stage))}</span></span></li>`).join('')}</ul>` : '<p class="empty">Nobody arriving or leaving in the next four hours.</p>'}</section>`);
  if (modOn('accommodation') && perm('accommodation') >= 1) {
    const today = dayKey(t);
    const arr = Object.values(S.col.bookings).filter(b => b.checkIn === today && b.status !== 'cancelled');
    blocks.push(`<section class="panel"><div class="ph"><h3>Hotel check-ins today</h3><div class="actions"><a class="btn sm" href="#/hq/accommodation">Open</a></div></div>${arr.length ? `<ul class="list">${arr.slice(0, 8).map(b => `<li><span>${esc(bookingGuest(b))}</span><span class="muted small" style="margin-left:auto">${esc(S.col.hotels[b.hotel]?.name || '')}</span></li>`).join('')}</ul>` : '<p class="empty">No check-ins today.</p>'}</section>`);
  }
  return head('Festival overview', `Every ${esc(T.stage.toLowerCase())} at a glance. Open a ${esc(T.stage.toLowerCase())} for its own run sheet, crew and display.`) +
    `<div class="grid g3" style="margin-bottom:1rem">${cards || `<div class="panel"><p class="empty">No ${esc(T.stages.toLowerCase())} yet. ${perm('admin') >= 2 ? 'Add them in <a href="#/hq/admin">Admin</a>.' : ''}</p></div>`}</div><div class="grid g2">${blocks.join('')}</div>`;
};
function msgBlock(sid) {

/* ---------- Lanes (timeline) ---------- */
function packRows(items) {
  const rows = []; const out = [];

  return {out, n:Math.max(1, rows.length)};
}

  lo = Math.floor((lo - 30 * MIN) / HOUR) * HOUR; hi = Math.ceil((hi + 30 * MIN) / HOUR) * HOUR; if (hi - lo < 6 * HOUR) hi = lo + 6 * HOUR;
  const span = hi - lo; const pct = ms => ((ms - lo) / span * 100).toFixed(3); const t = now();

  const step = 1;
  return `<div class="panel lanes" style="margin-bottom:1rem"><div class="lanes-inner" style="--hw:${(HOUR / span * 100).toFixed(3)}%;min-width:${Math.max(820, span / HOUR * 130)}px">

    ${lanes.map((ln, li) => { const {out, n} = packRows(ln.items.filter(i => eff(i).e - eff(i).s >= 5 * MIN)); const marks = ln.items.filter(i => eff(i).e - eff(i).s < 5 * MIN && i.kind !== 'access');
      return `<div class="lane"><div class="ln">${ln.tape ? `<span class="tape" style="--c:${ln.tape}"></span>` : ''}<span>${esc(ln.label)}${ln.sub ? `<small>${esc(ln.sub)}</small>` : ''}</span></div><div class="lt" style="--lh:${n * 28 + 10}px">

        return `<${tag} class="blk k-${i.kind} ${i.status || ''}" style="left:${pct(e.s)}%;width:max(30px,calc(${((e.e - e.s) / span * 100).toFixed(3)}% - 2px));top:${5 + r * 28}px;--c:${ln.tape || 'var(--accent)'}" ${editable ? `data-act="itemEdit" data-id="${esc(i.id)}"` : ''} title="${esc(KINDS[i.kind]?.l)}: ${esc(i.title)} ${fmtT(e.s)}–${fmtT(e.e)}"><b>${esc(ln.short ? (i.kind === 'show' ? i.title : KINDS[i.kind]?.l) : `${KINDS[i.kind]?.l} · ${artistName(i.artist) || i.title}`)}</b></${tag}>`; }).join('')}

  </div></div>`;
}

/* ---------- Clocks ---------- */
function clockValue(c, t) {
  if (c.kind === 'tod') { const tz = c.tz || TZ(); return {text:fmtT(t, true, tz), sub:`${tz.split('/').pop().replace('_', ' ')} · ${dayLabel(dayKey(t, tz))}`}; }
  if (c.kind === 'countdown') { const ms = (c.target || 0) - t; return {text:fmtCd(ms), state:cdState(ms, c.warn ?? 5), sub:ms < 0 ? `Passed ${fmtT(c.target)}` : `At ${fmtT(c.target)} · ${dayLabel(dayKey(c.target))}`}; }
  if (c.kind === 'timer') {
    const el = (c.accum || 0) + (c.runningSince ? t - c.runningSince : 0);
    if (c.duration) { const ms = c.duration - el; return {text:fmtCd(ms), state:c.runningSince ? cdState(ms, c.warn ?? 2) : '', sub:`${c.runningSince ? 'Running' : el ? 'Paused' : 'Ready'} · ${Math.round(c.duration / MIN)} min`}; }
    return {text:fmtCd(el).replace('+', ''), sub:c.runningSince ? 'Running' : el ? 'Paused' : 'Ready'};
  }
  if (c.kind === 'stage') {
    if (!S.col.stages[c.stage]) return {text:'--:--', sub:'Stage removed'};
    const {cur, next} = nowNext(c.stage);
    if (cur) { const ms = eff(cur).e - t; return {text:fmtCd(ms), state:cdState(ms, c.warn ?? 5), sub:`${cur.title} ends ${fmtT(eff(cur).e)}`}; }
    if (next) { const ms = eff(next).s - t; return {text:fmtCd(ms), state:cdState(ms, c.warn ?? 5), sub:`${next.title} at ${fmtT(eff(next).s)}`}; }
    return {text:'--:--', sub:'Nothing scheduled'};
  }
  return {text:'--:--'};
}

let FORM = null;
function openForm(def) {

    else if (f.type === 'checks') input = `<div class="checks">${f.options.map(([k, l]) => `<label><input type="checkbox" name="${f.k}" value="${esc(k)}" ${(val || []).includes(k) ? 'checked' : ''}>${esc(l)}</label>`).join('') || '<span class="muted small">None defined</span>'}</div>`;
    else input = `<input type="${f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text'}" name="${f.k}" value="${esc(val)}" placeholder="${esc(f.placeholder || '')}" ${f.type === 'number' ? 'step="any"' : ''}>`;

  });

}
function readForm() {
  const form = $('#fform'); const o = {};
  for (const f of FORM.fields) {
    if (f.type === 'note') continue;
    if (f.type === 'checks') { o[f.k] = [...form.querySelectorAll(`input[name="${f.k}"]:checked`)].map(x => x.value); continue; }
    const el = form.elements[f.k]; if (!el) continue;
    o[f.k] = f.type === 'datetime' ? fromLocal(el.value) : el.value;
  }
  return o;
}

async function syncClock() {
  try {
    if (!/^https?:/.test(location.protocol)) throw 0;
    const t0 = Date.now(); const r = await fetch(location.href, {method:'HEAD', cache:'no-store'}); const t1 = Date.now();
    const h = r.headers.get('date'); if (!h) throw 0;
    const off = Date.parse(h) + 500 - (t0 + t1) / 2;
    if (Math.abs(off) > 1500) { S.offset = off; S.sync = 'corrected'; } else { S.offset = 0; S.sync = 'ok'; }
  } catch { S.sync = 'device'; }
  renderStrip();
}

    try { S.me = await user.id(); } catch {}
    try { S.isOwner = await user.isOwner(); } catch {}
    try { S.shareEdit = await user.canEdit(); } catch {}
    try { const w = await user.can('data.write'); S.canWriteShared = w !== false; } catch {}

    let gotCfg = false, gotRoles = false, first = true;

    db.doc('config/event').onSnapshot(s => { S.cfg = s.exists ? s.data() : null; gotCfg = true; done(); }, failed);
    db.doc('config/roles').onSnapshot(s => { S.roles = s.exists ? {...DEFAULT_ROLES, ...s.data().roles} : DEFAULT_ROLES; gotRoles = true; done(); }, failed);
    for (const k of COLS) {
      const q = k === 'msgs' ? db.collection(k).orderBy('at', 'desc').limit(300) : db.collection(k);
      q.onSnapshot(snap => { const o = {}; snap.docs.forEach(d => o[d.id] = {id:d.id, ...d.data()}); S.col[k] = o; wantProfiles(); render(); }, e => { if (e.code !== 'revoked') console.warn(k, e); });
    }
    setTimeout(() => { if (!S.ready) { S.ready = true; route(); } }, 6000);
  } else {
    S.mode = 'local';
    let saved = null; try { saved = JSON.parse(localStorage.getItem('showctrl-demo-v2') || 'null'); } catch {}
    try { S.me = localStorage.getItem('showctrl-demo-me2') || 'demo-admin'; } catch { S.me = 'demo-admin'; }
    loadLocal(saved?.cfg ? saved : buildSample());
    S.ready = true; route();
  }
}
boot();

</script>
</body>
</html>
